services:
  postgres:
    image: postgres:17-alpine
    container_name: slack-app-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slack_app}
      POSTGRES_USER: ${POSTGRES_USER:-slack_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: slack-app-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: slack-app-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-slack_app};Username=${POSTGRES_USER:-slack_app};Password=${POSTGRES_PASSWORD:-change-me}
      ConnectionStrings__Redis: redis:6379
      Presence__Store: ${PRESENCE_STORE:-Redis}
      Presence__HeartbeatIntervalSeconds: ${PRESENCE_HEARTBEAT_INTERVAL_SECONDS:-20}
      Presence__HeartbeatTtlSeconds: ${PRESENCE_HEARTBEAT_TTL_SECONDS:-75}
      Presence__AfkThresholdSeconds: ${PRESENCE_AFK_THRESHOLD_SECONDS:-60}
      Presence__SweepIntervalSeconds: ${PRESENCE_SWEEP_INTERVAL_SECONDS:-15}
      Storage__UploadsRoot: /app/uploads
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_SIGNALR_URL: ${NEXT_PUBLIC_SIGNALR_URL:-http://localhost:8080/hubs/realtime}
    container_name: slack-app-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_SIGNALR_URL: ${NEXT_PUBLIC_SIGNALR_URL:-http://localhost:8080/hubs/realtime}
    ports:
      - "${WEB_HTTP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
